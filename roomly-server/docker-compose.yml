# docker compose up -d            → MongoDB only (run the API with `npm run dev`)
# docker compose --profile api up → MongoDB + API
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["api"]
    build: .
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["5000:5000"]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/roomly
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or a .env file}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5000}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_DISPLAY_NUMBER: ${WHATSAPP_DISPLAY_NUMBER:-}
      WHATSAPP_GROUPS_ENABLED: ${WHATSAPP_GROUPS_ENABLED:-false}
    volumes: [uploads:/app/uploads]

volumes:
  mongo-data:
  uploads:
