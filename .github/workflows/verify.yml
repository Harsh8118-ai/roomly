name: Verify Roomly

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roomly/package-lock.json
      - run: npm ci
        working-directory: roomly
      - run: npm run build
        working-directory: roomly

  backend:
    name: Backend tests and JavaScript syntax
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/roomly_test
      # Test-only values; never production credentials.
      JWT_SECRET: roomly-ci-test-secret-not-used-outside-ci
      WHATSAPP_ACCESS_TOKEN: test-token
      WHATSAPP_PHONE_NUMBER_ID: "1065403522"
      WHATSAPP_APP_SECRET: test-app-secret
      WHATSAPP_VERIFY_TOKEN: test-verify-token
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roomly-server/package-lock.json
      - run: npm ci
        working-directory: roomly-server
      - run: npm test
        working-directory: roomly-server
      - name: Check JavaScript syntax
        run: find roomly-server/src -name '*.js' -print0 | xargs -0 -n1 node --check
